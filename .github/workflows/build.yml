name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        shell: powershell
        run: .\build.ps1 -Package
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrPhone-win64
          path: |
            dist/ScrPhone-v0.1.0-win64.zip
            dist/ScrPhone-v0.1.0-win64.zip.sha256
          if-no-files-found: error
